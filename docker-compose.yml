services:
  db:
    image: postgres:17
    container_name: origis-db
    environment:
      POSTGRES_DB: origis
      POSTGRES_USER: origis
      POSTGRES_PASSWORD: origis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origis -d origis"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: origis-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio:/data

  app:
    build:
      context: .
    container_name: origis-app
    ports:
      - "26125:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
#    environment:
#      JDBC_URL
volumes:
  pgdata:
  minio:
